<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Instant loading splash ("Ember"). Inlined so it paints on the first
         frame, before the JS bundle or the built stylesheet arrives. The
         gradients duplicate --scene-background in src/index.css and the 3D
         sun (both breakpoints) so the fade-out reveals the scene with no
         color jump — keep in sync. -->
    <style>
      @font-face {
        font-family: "Roboto Slab";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/roboto-slab-latin.woff2") format("woff2");
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: "Roboto Slab", Georgia, serif;
        /* The scene as its first frame shows it: the 3D sun (SUN_FRAGMENT in
           Experience.jsx, bar its faint rays — the body, glow and halo, then
           the haze band on the horizon line, their stops sampled from the
           shader's falloffs) over the resolved --scene-background from
           src/index.css. Keep all three in sync. Placed like the canvas,
           which sizes the sun by its short side and is 100dvh tall, or
           100lvh on an iPhone held upright (src/index.css): --canvas-vh
           and --canvas-vmin are 1% of its height and of its short side.
           --sun-reach and --sun-band are SUN_REACH and SUN_BAND times
           SUN_SCALE, in 100 --canvas-vmin, and 36.97 --canvas-vh is the
           camera's eye-level horizon. Desktop here; the mobile block below
           moves and scales the sun. */
        --canvas-vh: 1dvh;
        --canvas-vmin: 1dvmin;
        --sun-x: 85.5%;
        --sun-y: calc(27.8 * var(--canvas-vh));
        --sun-reach: calc(68.75 * var(--canvas-vmin));
        --sun-band: calc(100 * var(--canvas-vmin)) calc(6.25 * var(--canvas-vmin));
        --sun-warmth: 61.875rem 33.75rem;
        background:
          radial-gradient(
            circle var(--sun-reach) at var(--sun-x) var(--sun-y),
            rgba(255, 140, 96, 1) 0%,
            rgba(255, 138, 95, 1) 1.18%,
            rgba(255, 129, 89, 0.998) 3.13%,
            rgba(255, 125, 87, 0.988) 3.85%,
            rgba(255, 123, 86, 0.97) 4.31%,
            rgba(254, 121, 85, 0.942) 4.69%,
            rgba(254, 119, 84, 0.9) 5.04%,
            rgba(253, 117, 83, 0.83) 5.48%,
            rgba(251, 114, 82, 0.752) 5.96%,
            rgba(251, 113, 82, 0.713) 6.29%,
            rgba(250, 111, 81, 0.684) 6.67%,
            rgba(249, 109, 80, 0.613) 8.2%,
            rgba(247, 105, 78, 0.518) 10.55%,
            rgba(245, 102, 77, 0.441) 12.8%,
            rgba(244, 99, 76, 0.376) 15.16%,
            rgba(243, 97, 75, 0.318) 17.83%,
            rgba(242, 96, 74, 0.265) 21.09%,
            rgba(242, 95, 74, 0.215) 25.26%,
            rgba(242, 95, 74, 0.159) 31.7%,
            rgba(242, 95, 74, 0.109) 39.37%,
            rgba(242, 95, 74, 0.0682) 48.14%,
            rgba(242, 95, 74, 0.0363) 58.79%,
            rgba(242, 95, 74, 0.0135) 72.37%,
            rgba(242, 95, 74, 0.0013) 90.56%,
            rgba(242, 95, 74, 0) 100%
          ),
          radial-gradient(
            ellipse var(--sun-band) at var(--sun-x) calc(36.97 * var(--canvas-vh)),
            rgba(252, 161, 132, 0.5) 0%,
            rgba(252, 161, 132, 0.492) 7.26%,
            rgba(252, 161, 132, 0.468) 14.77%,
            rgba(252, 161, 132, 0.425) 22.89%,
            rgba(252, 161, 132, 0.358) 32.48%,
            rgba(252, 161, 132, 0.142) 58.49%,
            rgba(252, 161, 132, 0.0785) 67.86%,
            rgba(252, 161, 132, 0.0372) 76.13%,
            rgba(252, 161, 132, 0.0122) 84.28%,
            rgba(252, 161, 132, 0.001) 93.5%,
            rgba(252, 161, 132, 0) 100%
          ),
          radial-gradient(
            ellipse var(--sun-warmth) at var(--sun-x) var(--sun-y),
            rgba(198, 72, 58, 0.26) 0%,
            rgba(207, 80, 63, 0.2) 22%,
            rgba(222, 106, 79, 0.12) 45%,
            rgba(236, 140, 104, 0.05) 72%,
            rgba(236, 140, 104, 0) 100%
          ),
          linear-gradient(180deg, #e4a7a4 0%, #efc5b8 42%, #f0c6b7 72%, #f1cabb 100%)
          #efc5b8;
        opacity: 1;
        transition: opacity 0.45s ease-in-out 0.2s;
      }
      #app-loader.app-loader--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-loader__stack {
        display: grid;
        /* minmax(0, 1fr): the wordmark can't wrap (&nbsp;), and an implicit
           column grows to its max-content — wider than the stack — which
           drags .app-loader__track (width:100%) off-center. Pinning the
           column to the container keeps any overflow symmetric. */
        grid-template-columns: minmax(0, 1fr);
        justify-items: center;
        gap: 1.6rem;
        /* 100% of the padded grid area — a viewport unit here can exceed it
           and overflow resolves as start-alignment on iOS, off-centering the
           whole stack */
        width: 100%;
        max-width: 460px;
      }
      .app-loader__title {
        margin: 0;
        /* 3.15rem cap: at 3.4rem the tracked wordmark is ~488px — wider than
           the 460px stack */
        font-size: clamp(1.9rem, 6vw, 3.15rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        text-align: center;
        color: #1a202c;
      }
      .app-loader__subtitle {
        margin: -0.6rem 0 0;
        padding-left: 0.42em;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: #555;
      }
      .app-loader__track {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 5px;
        border-radius: 999px;
        background: rgba(26, 32, 44, 0.12);
      }
      .app-loader__bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, #c6483a, #de6a4f);
        /* transform-only sweep: it runs on the compositor, so the bar keeps
           moving while the main thread parses/executes the JS bundle —
           animating left/width would freeze exactly when this splash matters */
        will-change: transform;
        animation: app-loader-sweep 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes app-loader-sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(264%);
        }
      }
      @keyframes app-loader-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      .app-loader__sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      @media (max-width: 990px) {
        #app-loader {
          --sun-x: 80%;
          --sun-y: calc(31 * var(--canvas-vh));
          --sun-reach: calc(75.625 * var(--canvas-vmin));
          --sun-band: calc(110 * var(--canvas-vmin)) calc(6.875 * var(--canvas-vmin));
          --sun-warmth: 45rem 24rem;
        }
      }
      /* The same gate as html, body, #root and .section in src/index.css
         (an iPhone held upright): change both together. */
      @supports (height: 100lvh) and (-webkit-touch-callout: none) {
        @media (max-width: 990px) and (orientation: portrait) and (not (min-width: 600px)) {
          #app-loader {
            --canvas-vh: 1lvh;
            --canvas-vmin: 1lvmin;
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* static partial-width bar with a gentle pulse instead of the sweep
           (the global reduced-motion kill-switch in src/index.css later
           freezes even the pulse — acceptable, spec allows fully static) */
        .app-loader__bar {
          animation: app-loader-pulse 2.4s ease-in-out infinite;
        }
      }
    </style>
    <!-- Self-hosted Roboto Slab (see @font-face in the inline <style> above) — no render-blocking third-party request -->
    <link
      rel="preload"
      href="/fonts/roboto-slab-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Preload the assets that gate the scene reveal — the Home section only:
         the avatar and its two animations, the Home props, the Home title font
         and the laptop screen (the splash hides on the first frame after they
         all resolve and pre-warm). They download in parallel with the JS bundle
         instead of after it: they are otherwise requested by module-level
         useGLTF.preload() *inside* the bundle, so they can't start until
         three.js + r3f finish downloading and executing. three fetches via
         fetch() (cors mode, same-origin creds), so as="fetch" crossorigin
         matches the real request and avoids a double-download. The other
         sections load in the background after the first frame — no preloads. -->
    <link rel="preload" href="/models/68275e863c5ab94b9eacc586.glb" as="fetch" crossorigin />
    <link rel="preload" href="/animations/Happy-Idle.glb" as="fetch" crossorigin />
    <link rel="preload" href="/animations/Walking.glb" as="fetch" crossorigin />
    <link rel="preload" href="/models/MacBook%20Pro.glb" as="fetch" crossorigin />
    <link rel="preload" href="/fonts/Inter_Bold.json" as="fetch" crossorigin />
    <!-- TextureLoader goes through an <img> with crossOrigin="anonymous" -->
    <link rel="preload" href="/textures/screen.webp" as="image" crossorigin />
    <!-- Environment HDR: warm the HTTP cache early so the eval-time RGBELoader
         preload (see Experience.jsx) resolves instantly. crossorigin is required
         to match three FileLoader's same-origin cors fetch (no double download). -->
    <link rel="preload" href="/hdri/venice_sunset_256.hdr" as="fetch" crossorigin />

  <body>
    <!-- Hidden by src/lib/initialLoader.js on the first rendered WebGL frame -->
    <div id="app-loader" role="status" aria-live="polite">
      <!-- The evening's first paints, while the splash covers them (.paint-warm in src/index.css) -->
      <div class="paint-warm" aria-hidden="true">
